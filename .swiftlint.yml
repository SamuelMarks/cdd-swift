excluded:
  - .build
  - test_cli/.build
  - .swiftpm
  - Package.resolved
  - test_out
  - cdd-test-relative-dir

disabled_rules:
  - file_length
  - type_body_length
  - optional_data_string_conversion
  - opening_brace

opt_in_rules:
  - force_unwrapping
  - fatal_error_message

line_length:
  warning: 3000
  error: 3000

cyclomatic_complexity:
  warning: 200
  error: 200

function_body_length:
  warning: 2000
  error: 2000

identifier_name:
  allowed_symbols: ["_"]
  min_length:
    warning: 1
    error: 1
