excluded:
  - .build
  - test_cli/.build
  - .swiftpm
  - Package.resolved
  - test_out
  - cdd-test-relative-dir

disabled_rules:
  - opening_brace
  - optional_data_string_conversion
  - colon
  - comma
  - duplicate_imports
  - switch_case_alignment
  - nesting
  - type_name
  - unused_closure_parameter
  - unused_optional_binding
  - comment_spacing
  - vertical_whitespace

opt_in_rules:
  - force_unwrapping
  - fatal_error_message
  - force_cast
  - force_try
  - implicitly_unwrapped_optional

file_length:
  warning: 950
  error: 1100

type_body_length:
  warning: 500
  error: 650

line_length:
  warning: 320
  error: 450
  ignores_interpolated_strings: true
  ignores_urls: true
  ignores_comments: true

cyclomatic_complexity:
  warning: 45
  error: 60

function_body_length:
  warning: 350
  error: 650

identifier_name:
  allowed_symbols: ["_"]
  min_length:
    warning: 1
    error: 1
