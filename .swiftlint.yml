excluded:
  - .build
  - test_cli/.build
  - .swiftpm
  - Package.resolved
  - test_out
  - cdd-test-relative-dir

disabled_rules:
  - optional_data_string_conversion

opt_in_rules:
  - force_unwrapping
  - fatal_error_message
  - force_cast
  - force_try
  - implicitly_unwrapped_optional

file_length:
  warning: 500
  error: 650

type_body_length:
  warning: 250
  error: 350

line_length:
  warning: 140
  error: 180
  ignores_interpolated_strings: true
  ignores_urls: true
  ignores_comments: true

cyclomatic_complexity:
  warning: 10
  error: 15

function_body_length:
  warning: 60
  error: 100

identifier_name:
  allowed_symbols: ["_"]
  min_length:
    warning: 1
    error: 1
